apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: lora-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          workingDir: /data
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: app-data
              mountPath: /data
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000