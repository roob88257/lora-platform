services:
  redis:
    image: redis:7-alpine

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    working_dir: /data
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app_data:/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A worker.tasks worker --loglevel=info --concurrency=1
    working_dir: /data
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app_data:/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis

volumes:
  app_data:
  hf_cache: